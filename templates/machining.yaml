buffers:
  raw: 200
  cnc_in: 40
  deb_in: 24
  ins_in: 24
  fg: 200

stations:
  - {id: RCV1, type: receiving, name: 毛坯来料, pos: [6, 12], size: [6, 6], pcs_per_hour: 34, porosity_pct: 3.0, supplier: 外购毛坯}
  - {id: CNC1, type: cnc, group: CNC, name: 1#加工中心, pos: [20, 10], size: [4, 3.4], mtbf_h: 120, mttr_min: 40}
  - {id: CNC2, type: cnc, group: CNC, name: 2#加工中心, pos: [27, 10], size: [4, 3.4], mtbf_h: 120, mttr_min: 40}
  - {id: CNC3, type: cnc, group: CNC, name: 3#加工中心, pos: [34, 10], size: [4, 3.4], mtbf_h: 120, mttr_min: 40}
  - {id: CNC4, type: cnc, group: CNC, name: 4#加工中心, pos: [20, 18], size: [4, 3.4], mtbf_h: 120, mttr_min: 40}
  - {id: DEB1, type: deburr_cell, name: 机器人去毛刺单元, pos: [47, 12], size: [5, 5], mtbf_h: 200, mttr_min: 20}
  - {id: INS1, type: inspection, name: 自动内窥检测站, pos: [54, 12], size: [4, 4], mtbf_h: 300, mttr_min: 20}
  - {id: ASRS1, type: warehouse, name: 成品立体仓库, pos: [69, 13], size: [12, 18], slots: 600, ship_every_h: 4}
