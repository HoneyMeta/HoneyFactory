    speed: 1.2
    corridor_y: -3
    nodes: {raw: [8, 4], cnc_in: [27, 3], fg: [56, 4], asrs: [63, 4], charger: [30, -12]}
  - id: CREW
    type: worker_crew
    name: 生产班组
    pos: [30, 30]
    size: [1, 1]
    roles:
      - {name: CNC 操作工, count: 2, stations: [CNC1, CNC2, CNC3, CNC4]}
      - {name: 去毛刺/返修工, count: 1, stations: [DEB1, INS1]}
      - {name: 仓管员, count: 1, stations: [ASRS1]}
