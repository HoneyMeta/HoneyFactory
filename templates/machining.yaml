# 模板：机加工厂（毛坯来料 → CNC → 去毛刺 → 内窥检测 → 立库）
plant:
  name: 新建机加工厂
  product: 外购铸件精加工
  seed: 11
  start: '2026-11-02T07:00:00'
  dt: 1.0
  speed: 10
  warmup_h: 2
  floor: [80, 50]

areas:
  - {name: 收货区, x: [0, 14], color: '#F2EEE3'}
  - {name: 机加区, x: [14, 44], color: '#E3ECF2'}
  - {name: 检测区, x: [44, 58], color: '#E8E3F2'}
