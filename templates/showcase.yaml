# 示范工厂：某转向器壳体铸造厂（铸造 + 机加 + 去毛刺 + 内窥检测 + 检测后分拣段 + 立库），2.0 项目模型。
# 坐标单位 m：x 沿厂房长度方向，y 为进深方向；size = [长, 宽]。分拣段 CELL1 由独立的 PLC 块控制（信号线连接），梯形图程序在该 PLC 块的 params.program。
