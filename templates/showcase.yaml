- id: CELL1
  type: cell
  name: 检测后分拣段
  pos: [120.5, 20.5]
  size: [8, 3.6]
  rot: 0
  area: 检测区
  node: [2875, 190]
  params:
    cell:
      size: [8, 3.6]
      components:
      - id: IN1
        type: cell_entry
        pos: [-3.6, 0, 0.27]
        rot: 0
        label: 来自内窥检测
        params:
          min_gap: 4.0
          assign:
            default: {kind: part, color: grey, material: metal, h: 0.18, w: 0.26}
            defect:
              color: red
      - id: C1
        type: belt_conveyor
        pos: [0, 0, 0]
        rot: 0
        size: [7.6, 0.6]
        label: 分拣输送带
        params:
          speed: 0.3
      - id: V1
        type: vision_sensor
        pos: [-0.6, 0, 0.9]
        rot: 0
        label: 视觉复检
        params: {radius: 0.12, mode: color}
      - {id: S1, type: diffuse_sensor, pos: [0.6, 0.35, 0.33], rot: 0, label: 推杆前光电}
      - id: P1
        type: pusher
        pos: [0.6, 0.42, 0.33]
        rot: 0
        label: 剔除推杆
        params: {stroke: 0.8, speed: 1.0}
      - id: OUT_NG
        type: cell_exit
        pos: [0.6, -0.76, 0]
        rot: 0
        size: [0.9, 0.9]
        label: NG 料箱
        params:
          port: ng
          accept:
            color: red
      - {id: S_END, type: diffuse_sensor, pos: [3.3, 0.35, 0.33], rot: 0, label: 线尾计数光电}
      - id: OUT_OK
        type: cell_exit
        pos: [3.85, 0, 0]
        rot: 0
        size: [0.3, 0.9]
        label: 合格出口
        params:
          accept:
            color: grey
      - id: START
        type: button
        pos: [-3.5, 1.45, 0.95]
        rot: 0
        label: 启动
        params:
          color: green
      - id: STOP
        type: button
        pos: [-3.3, 1.45, 0.95]
        rot: 0
        label: 停止
        params: {color: red, nc: true}
      - {id: ESTOP, type: estop, pos: [-3.05, 1.45, 0.95], rot: 0, label: 急停}
      - id: LAMP_RUN
        type: lamp
        pos: [-2.8, 1.45, 0.95]
        rot: 0
        label: 运行
        params:
          color: green
      - id: LAMP_NG
        type: lamp
        pos: [-2.6, 1.45, 0.95]
        rot: 0
        label: 剔除
        params:
          color: red
      - {id: D1, type: display, pos: [-2.3, 1.45, 0.95], rot: 0, label: 合格数}
      io:
      - {name: IN1_READY, dir: in, type: BOOL, addr: '%I0.0', comp: IN1, signal: ready, comment: 来自内窥检测 IN1 上游有料, contact: 'NO', idle: 0}
      - {name: C1_FWD, dir: out, type: BOOL, addr: '%Q0.0', comp: C1, signal: fwd, comment: 分拣输送带 C1 正转, idle: false}
      - {name: V1_DETECT, dir: in, type: BOOL, addr: '%I0.1', comp: V1, signal: detect, comment: 视觉复检 V1 视野内有零件, contact: 'NO', idle: 0}
      - {name: V1_CODE, dir: in, type: INT, addr: '%IW100', comp: V1, signal: code, comment: 视觉复检 V1 识别码, idle: 0}
      - {name: S1, dir: in, type: BOOL, addr: '%I0.2', comp: S1, signal: detect, comment: 推杆前光电 S1 检测到, contact: 'NO', idle: 0}
      - {name: P1_FRONT, dir: in, type: BOOL, addr: '%I0.3', comp: P1, signal: front, comment: 剔除推杆 P1 伸出到位, contact: 'NO', idle: 0}
      - {name: P1_BACK, dir: in, type: BOOL, addr: '%I0.4', comp: P1, signal: back, comment: 剔除推杆 P1 缩回到位, contact: 'NO', idle: 1}
      - {name: P1_EXTEND, dir: out, type: BOOL, addr: '%Q0.1', comp: P1, signal: extend, comment: 剔除推杆 P1 伸出, idle: false}
      - {name: OUT_NG_BUSY, dir: in, type: BOOL, addr: '%I0.5', comp: OUT_NG, signal: busy, comment: NG 料箱 OUT_NG 出口占用（下游满）, contact: 'NO', idle: 0}
      - {name: S_END, dir: in, type: BOOL, addr: '%I0.6', comp: S_END, signal: detect, comment: 线尾计数光电 S_END 检测到, contact: 'NO', idle: 0}
      - {name: OUT_OK_BUSY, dir: in, type: BOOL, addr: '%I0.7', comp: OUT_OK, signal: busy, comment: 合格出口 OUT_OK 出口占用（下游满）, contact: 'NO', idle: 0}
      - {name: START, dir: in, type: BOOL, addr: '%I1.0', comp: START, signal: value, comment: 启动 START 触点, contact: 'NO', idle: 0}
      - {name: STOP, dir: in, type: BOOL, addr: '%I1.1', comp: STOP, signal: value, comment: 停止 STOP 触点, contact: NC, idle: 1}
      - {name: ESTOP, dir: in, type: BOOL, addr: '%I1.2', comp: ESTOP, signal: value, comment: 急停 ESTOP 触点, contact: NC, idle: 1}
      - {name: LAMP_RUN, dir: out, type: BOOL, addr: '%Q0.2', comp: LAMP_RUN, signal: 'on', comment: 运行 LAMP_RUN 点亮, idle: false}
      - {name: LAMP_NG, dir: out, type: BOOL, addr: '%Q0.3', comp: LAMP_NG, signal: 'on', comment: 剔除 LAMP_NG 点亮, idle: false}
      - {name: D1, dir: out, type: INT, addr: '%QW100', comp: D1, signal: value, comment: 合格数 D1 显示值, idle: 0}
    substep_ms: 40
    bypass_s: 30
- id: PLC1
  type: plc
  name: 检测后分拣段 PLC
  pos: [126.0, 19.2]
  size: [1.2, 0.6]
  rot: 0
  params:
    model: generic
    scan_ms: 20
    mode: internal
    program:
      id: main
      name: 分拣段主程序
      lang: LD
      vars:
      - {name: RUN, type: BOOL, init: true, comment: 运行（上电即运行）}
      - {name: IS_NG, type: BOOL, comment: 视觉判定的缺陷件在途}
      - {name: PUSH, type: BOOL, comment: 推杆动作中}
      - {name: OK_FULL, type: BOOL, comment: 计数器满（不用）}
      source:
        rungs:
        - comment: 启保停：上电即运行（RUN 初值为 1）；停止、急停是常闭触点
          elements:
          - par:
            - - {t: 'NO', var: START}
            - - {t: 'NO', var: RUN}
          - {t: 'NO', var: STOP}
          - {t: 'NO', var: ESTOP}
          - {t: COIL, var: RUN}
        - comment: 输送带
          elements:
          - {t: 'NO', var: RUN}
          - {t: COIL, var: C1_FWD}
        - comment: 运行指示灯
          elements:
          - {t: 'NO', var: RUN}
          - {t: COIL, var: LAMP_RUN}
        - comment: 视觉复检：识别到缺陷（红色码 4）置位 NG 标志
          elements:
          - {t: 'NO', var: V1_DETECT}
          - {t: CMP, op: '=', a: V1_CODE, b: '4'}
          - {t: SET, var: IS_NG}
        - comment: 视觉看到合格件：复位 NG 标志
          elements:
          - {t: 'NO', var: V1_DETECT}
          - {t: CMP, op: <>, a: V1_CODE, b: '4'}
          - {t: RESET, var: IS_NG}
        - comment: NG 件到推杆前（S1 上升沿）：推杆动作
          elements:
          - {t: P, var: S1}
          - {t: 'NO', var: IS_NG}
          - {t: 'NO', var: RUN}
          - {t: SET, var: PUSH}
        - comment: 推杆动作后清掉 NG 标志
          elements:
          - {t: 'NO', var: PUSH}
          - {t: RESET, var: IS_NG}
        - comment: 伸出到位或停机：推杆缩回
          elements:
          - par:
            - - {t: 'NO', var: P1_FRONT}
            - - {t: NC, var: RUN}
          - {t: RESET, var: PUSH}
        - comment: 推杆电磁阀
          elements:
          - {t: 'NO', var: PUSH}
          - {t: COIL, var: P1_EXTEND}
        - comment: 剔除指示灯：剔除后亮 3 秒
          elements:
          - {t: 'NO', var: PUSH}
          - t: FB
            fb: TOF
            inst: T_NG
            in:
              PT: T#3s
          - {t: COIL, var: LAMP_NG}
        - comment: 合格件计数（线尾光电）
          elements:
          - {t: 'NO', var: S_END}
          - t: FB
            fb: CTU
            inst: C_OK
            in: {R: 'FALSE', PV: '32767'}
          - {t: COIL, var: OK_FULL}
        - comment: 数码管显示合格数
          elements:
          - {t: MOVE, in: C_OK.CV, out: D1}
    di: 11
    do: 4
    ai: 1
    ao: 1
    migrated_from: CELL1
    hmi:
    - id: sort_panel
      name: 分拣段操作画面
      cell: PLC1
      size: [940, 520]
      widgets:
      - {id: g1, type: rect, x: 20, y: 20, w: 430, h: 220, label: 操作台, color: '#7d8893'}
      - {id: b1, type: button, x: 40, y: 50, w: 120, h: 50, label: 启动, var: START, panel: true, mode: momentary, color: '#1f9d55'}
      - {id: b2, type: button, x: 175, y: 50, w: 120, h: 50, label: 停止, var: STOP, panel: true, mode: momentary, color: '#c83a3a'}
      - {id: b3, type: button, x: 310, y: 50, w: 120, h: 50, label: 急停（按下/复位）, var: ESTOP, panel: true, mode: toggle, color: '#b91c1c'}
      - {id: l1, type: lamp, x: 40, y: 120, w: 120, h: 44, label: 运行, var: LAMP_RUN, color: '#22c55e'}
      - {id: l2, type: lamp, x: 175, y: 120, w: 120, h: 44, label: 剔除, var: LAMP_NG, color: '#ef4444'}
      - {id: l3, type: lamp, x: 310, y: 120, w: 130, h: 44, label: 输送带, var: C1_FWD, color: '#3b82f6'}
      - {id: n1, type: number, x: 40, y: 176, w: 190, h: 56, label: 合格数（数码管 D1）, var: D1, unit: 件}
      - {id: n2, type: number, x: 245, y: 176, w: 190, h: 56, label: 视觉识别码（4=缺陷）, var: V1_CODE}
      - {id: g2, type: rect, x: 470, y: 20, w: 450, h: 220, label: 现场信号, color: '#7d8893'}
      - {id: s1, type: lamp, x: 490, y: 50, w: 135, h: 40, label: 视觉有件, var: V1_DETECT, color: '#f2b632'}
      - {id: s2, type: lamp, x: 635, y: 50, w: 135, h: 40, label: 推杆前光电, var: S1, color: '#f2b632'}
      - {id: s3, type: lamp, x: 780, y: 50, w: 135, h: 40, label: 线尾光电, var: S_END, color: '#f2b632'}
      - {id: s4, type: lamp, x: 490, y: 100, w: 135, h: 40, label: 推杆伸出, var: P1_EXTEND, color: '#3b82f6'}
      - {id: s5, type: lamp, x: 635, y: 100, w: 135, h: 40, label: 伸出到位, var: P1_FRONT, color: '#3b82f6'}
      - {id: s6, type: lamp, x: 780, y: 100, w: 135, h: 40, label: 缺陷件在途, var: IS_NG, color: '#ef4444'}
      - {id: s7, type: lamp, x: 490, y: 150, w: 135, h: 40, label: NG 箱满, var: OUT_NG_BUSY, color: '#ef4444'}
      - {id: s8, type: lamp, x: 635, y: 150, w: 135, h: 40, label: 合格口满, var: OUT_OK_BUSY, color: '#ef4444'}
      - {id: t1, type: trend, x: 20, y: 260, w: 900, h: 180, label: 输送带 / 推杆前光电 / 推杆, vars: [C1_FWD, S1, P1_EXTEND], min: 0, max: 1.2}
      - {id: x1, type: text, x: 20, y: 452, w: 900, h: 50, size: 13, label: 按钮等于按单元操作台上的实体按钮（停止、急停是常闭接法，单元自动处理）。视觉看到红色（缺陷）件时，推杆在光电 S1 处把它推进 NG 料箱。}
  area: 检测区
  node: [2875, 360]
