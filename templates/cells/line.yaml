# 控制单元演示：整线联动（接入整厂）
# 由 python -m vfactory.control.showcase --templates 生成：场景 s15_full_line + 参考答案（程序在 PLC 块的 params.program，信号线接单元 I/O）
version: 2

plant:
  name: 控制单元演示：整线联动（接入整厂）
  product: 实训零件
  seed: 7
  start: now
  dt: 1.0
  speed: 1
  warmup_h: 0
  floor: [23, 12.6]

areas:
- {name: 实训区, x: [0, 23], color: '#E3ECF2'}

blocks:
- id: CELL1
  type: cell
  name: 整线联动（接入整厂）
  pos: [11.5, 6.3]
  size: [9, 4.6]
  rot: 0
  node: [300, 120]
  params:
    cell:
      size: [9, 4.6]
      components:
      - id: IN1
        type: cell_entry
        pos: [-4.1, 0, 0.27]
        rot: 0
        label: 单元入口
        params:
          min_gap: 6.0
          assign:
            random:
            - {color: blue, material: plastic, weight: 4}
            - {color: green, material: plastic, weight: 2}
            - {color: grey, material: metal, weight: 3}
            default: {kind: box, h: 0.2, w: 0.25}
      - id: C1
        type: belt_conveyor
        pos: [-1.65, 0, 0]
        rot: 0
        size: [5.7, 0.6]
        label: 主输送带
        params:
          speed: 0.3
      - {id: ST1, type: stopper, pos: [-2.8, 0, 0], rot: 0, label: 加工工位挡停}
      - {id: S1, type: diffuse_sensor, pos: [-2.84, 0.35, 0.35], rot: 0, label: 加工工位光电}
      - {id: V1, type: vision_sensor, pos: [-1.9, 0, 0.9], rot: 0, label: 颜色检测}
      - {id: S2, type: diffuse_sensor, pos: [-1.0, 0.35, 0.35], rot: 0, label: 剔除推杆光电}
      - id: P1
        type: pusher
        pos: [-1.0, 0.42, 0.35]
        rot: 0
        label: 剔除推杆
        params:
          stroke: 0.8
      - id: OUT_NG
        type: cell_exit
        pos: [-1.0, -0.76, 0]
        rot: 0
        size: [0.9, 0.9]
        label: 次品出口
        params:
          port: ng
          accept:
            color: green
      - {id: ST2, type: stopper, pos: [0.85, 0, 0], rot: 0, label: 分离挡停}
      - id: IND1
        type: inductive
        pos: [1.0, -0.3, 0.32]
        rot: 180
        label: 电感（金属）
        params:
          range: 0.2
      - {id: S_ST, type: diffuse_sensor, pos: [1.12, 0.35, 0.35], rot: 0, label: 过挡停光电}
      - id: T1
        type: turntable
        pos: [1.65, 0, 0]
        rot: 0
        size: [0.9, 0.9]
        label: 转台
        params:
          angle: -90
      - id: C2
        type: belt_conveyor
        pos: [3.2, 0, 0]
        rot: 0
        size: [2.2, 0.6]
        label: 塑料件输送带
        params:
          speed: 0.3
      - id: C3
        type: belt_conveyor
        pos: [1.65, -1.3, 0]
        rot: -90
        size: [1.7, 0.6]
        label: 金属件输送带
        params:
          speed: 0.3
      - id: OUT_PL
        type: cell_exit
        pos: [4.35, 0, 0]
        rot: 0
        size: [0.3, 0.9]
        label: 塑料件出口
        params:
          accept: {material: plastic, color: blue}
      - id: OUT_ME
        type: cell_exit
        pos: [1.65, -2.2, 0]
        rot: 0
        size: [0.9, 0.2]
        label: 金属件出口
        params:
          accept:
            material: metal
      - id: START
        type: button
        pos: [-4.1, 1.9, 0.95]
        rot: 0
        label: 启动
        params:
          color: green
      - id: STOP
        type: button
        pos: [-3.8999999999999995, 1.9, 0.95]
        rot: 0
        label: 停止
        params: {color: red, nc: true}
      - {id: ESTOP, type: estop, pos: [-3.6499999999999995, 1.9, 0.95], rot: 0, label: 急停}
      - id: LAMP_RUN
        type: lamp
        pos: [-3.3999999999999995, 1.9, 0.95]
        rot: 0
        label: 运行
        params:
          color: green
      - id: LAMP_WORK
        type: lamp
        pos: [-3.1999999999999997, 1.9, 0.95]
        rot: 0
        label: 加工中
        params:
          color: yellow
      - {id: D1, type: display, pos: [-2.9999999999999996, 1.9, 0.95], rot: 0, label: 合格数}
      io:
      - {name: IN1_READY, dir: in, type: BOOL, addr: '%I0.0', comp: IN1, signal: ready, comment: 单元入口 IN1 上游有料, contact: 'NO', idle: 0}
      - {name: C1_FWD, dir: out, type: BOOL, addr: '%Q0.0', comp: C1, signal: fwd, comment: 主输送带 C1 正转, idle: false}
      - {name: ST1_RAISE, dir: out, type: BOOL, addr: '%Q0.1', comp: ST1, signal: raise, comment: 加工工位挡停 ST1 升起挡料, idle: false}
      - {name: S1, dir: in, type: BOOL, addr: '%I0.1', comp: S1, signal: detect, comment: 加工工位光电 S1 检测到, contact: 'NO', idle: 0}
      - {name: V1_DETECT, dir: in, type: BOOL, addr: '%I0.2', comp: V1, signal: detect, comment: 颜色检测 V1 视野内有零件, contact: 'NO', idle: 0}
      - {name: V1_CODE, dir: in, type: INT, addr: '%IW100', comp: V1, signal: code, comment: 颜色检测 V1 识别码, idle: 0}
      - {name: S2, dir: in, type: BOOL, addr: '%I0.3', comp: S2, signal: detect, comment: 剔除推杆光电 S2 检测到, contact: 'NO', idle: 0}
      - {name: P1_FRONT, dir: in, type: BOOL, addr: '%I0.4', comp: P1, signal: front, comment: 剔除推杆 P1 伸出到位, contact: 'NO', idle: 0}
      - {name: P1_BACK, dir: in, type: BOOL, addr: '%I0.5', comp: P1, signal: back, comment: 剔除推杆 P1 缩回到位, contact: 'NO', idle: 1}
      - {name: P1_EXTEND, dir: out, type: BOOL, addr: '%Q0.2', comp: P1, signal: extend, comment: 剔除推杆 P1 伸出, idle: false}
      - {name: OUT_NG_BUSY, dir: in, type: BOOL, addr: '%I0.6', comp: OUT_NG, signal: busy, comment: 次品出口 OUT_NG 出口占用（下游满）, contact: 'NO', idle: 0}
      - {name: ST2_RAISE, dir: out, type: BOOL, addr: '%Q0.3', comp: ST2, signal: raise, comment: 分离挡停 ST2 升起挡料, idle: false}
      - {name: IND1, dir: in, type: BOOL, addr: '%I0.7', comp: IND1, signal: detect, comment: 电感（金属） IND1 检测到, contact: 'NO', idle: 0}
      - {name: S_ST, dir: in, type: BOOL, addr: '%I1.0', comp: S_ST, signal: detect, comment: 过挡停光电 S_ST 检测到, contact: 'NO', idle: 0}
      - {name: T1_HOME, dir: in, type: BOOL, addr: '%I1.1', comp: T1, signal: home, comment: 转台 T1 在 0° 位, contact: 'NO', idle: 1}
      - {name: T1_TURNED, dir: in, type: BOOL, addr: '%I1.2', comp: T1, signal: turned, comment: 转台 T1 在转角位, contact: 'NO', idle: 0}
      - {name: T1_PART, dir: in, type: BOOL, addr: '%I1.3', comp: T1, signal: part, comment: 转台 T1 台面中央有零件, contact: 'NO', idle: 0}
      - {name: T1_TURN, dir: out, type: BOOL, addr: '%Q0.4', comp: T1, signal: turn, comment: 转台 T1 转到转角位, idle: false}
      - {name: T1_ROLL_FWD, dir: out, type: BOOL, addr: '%Q0.5', comp: T1, signal: roll_fwd, comment: 转台 T1 滚筒正转, idle: false}
      - {name: T1_ROLL_REV, dir: out, type: BOOL, addr: '%Q0.6', comp: T1, signal: roll_rev, comment: 转台 T1 滚筒反转, idle: false}
      - {name: C2_FWD, dir: out, type: BOOL, addr: '%Q0.7', comp: C2, signal: fwd, comment: 塑料件输送带 C2 正转, idle: false}
      - {name: C3_FWD, dir: out, type: BOOL, addr: '%Q1.0', comp: C3, signal: fwd, comment: 金属件输送带 C3 正转, idle: false}
      - {name: OUT_PL_BUSY, dir: in, type: BOOL, addr: '%I1.4', comp: OUT_PL, signal: busy, comment: 塑料件出口 OUT_PL 出口占用（下游满）, contact: 'NO', idle: 0}
      - {name: OUT_ME_BUSY, dir: in, type: BOOL, addr: '%I1.5', comp: OUT_ME, signal: busy, comment: 金属件出口 OUT_ME 出口占用（下游满）, contact: 'NO', idle: 0}
      - {name: START, dir: in, type: BOOL, addr: '%I1.6', comp: START, signal: value, comment: 启动 START 触点, contact: 'NO', idle: 0}
      - {name: STOP, dir: in, type: BOOL, addr: '%I1.7', comp: STOP, signal: value, comment: 停止 STOP 触点, contact: NC, idle: 1}
      - {name: ESTOP, dir: in, type: BOOL, addr: '%I2.0', comp: ESTOP, signal: value, comment: 急停 ESTOP 触点, contact: NC, idle: 1}
      - {name: LAMP_RUN, dir: out, type: BOOL, addr: '%Q1.1', comp: LAMP_RUN, signal: 'on', comment: 运行 LAMP_RUN 点亮, idle: false}
      - {name: LAMP_WORK, dir: out, type: BOOL, addr: '%Q1.2', comp: LAMP_WORK, signal: 'on', comment: 加工中 LAMP_WORK 点亮, idle: false}
      - {name: D1, dir: out, type: INT, addr: '%QW100', comp: D1, signal: value, comment: 合格数 D1 显示值, idle: 0}
      metrics: [sort_accuracy, dwell_min.ST1, collisions, jams, throughput_per_min]
- id: PLC1
  type: plc
  name: 整线联动（接入整厂） PLC
  pos: [17.5, 4.5]
  size: [1.2, 0.6]
  rot: 0
  params:
    model: generic
    scan_ms: 20
    mode: internal
    program: {id: reference, name: 参考答案, lang: ST, vars: [], source: "PROGRAM FullLine\nVAR\n    RUN : BOOL := TRUE;     (* 演示：上电即运行 *)\n    (* 加工工位 *)\n    WT : TON;  PT1 : TON;  H1 : BOOL := TRUE;\n    (* 剔除 *)\n    IS_GREEN : BOOL;  PUSH : BOOL;  TRIG2 : R_TRIG;\n    (* 转台 *)\n    STEP : INT := 0;  METAL : BOOL;  TC : TON;  TL : TON;\n    GOOD : INT := 0;\nEND_VAR\n    (* 启停：启动按钮自锁，停止按钮和急停按钮都是常闭触点（没按时为\
        \ TRUE） *)\n    RUN := (START OR RUN) AND STOP AND ESTOP;\n    LAMP_RUN := RUN;\n    C1_FWD := RUN;  C2_FWD := RUN;  C3_FWD := RUN;\n    (* ---- 加工工位：停留 2 s ---- *)\n    WT(IN := S1 AND H1, PT := T#2200MS);\n    LAMP_WORK := S1 AND H1;\n    IF WT.Q THEN H1 := FALSE; END_IF;\n    PT1(IN := NOT H1, PT := T#1S);\n    IF PT1.Q THEN H1 := TRUE; END_IF;\n    ST1_RAISE := H1;\n    (* ---- 颜色剔除 ----\
        \ *)\n    IF V1_DETECT THEN IS_GREEN := (V1_CODE = 2); END_IF;\n    TRIG2(CLK := S2);\n    IF TRIG2.Q AND IS_GREEN AND RUN THEN PUSH := TRUE; IS_GREEN := FALSE; END_IF;\n    IF P1_FRONT OR NOT RUN THEN PUSH := FALSE; END_IF;\n    P1_EXTEND := PUSH;\n    (* ---- 转台分流 ---- *)\n    TC(IN := STEP = 3, PT := T#400MS);\n    TL(IN := STEP = 5 AND NOT T1_PART, PT := T#1500MS);\n    CASE STEP OF\n  \
        \      0:  METAL := FALSE;\n            IF RUN AND T1_HOME AND NOT T1_PART THEN STEP := 1; END_IF;\n        1:  IF IND1 THEN METAL := TRUE; END_IF;\n            IF S_ST THEN STEP := 2; END_IF;\n        2:  IF IND1 THEN METAL := TRUE; END_IF;\n            IF T1_PART THEN STEP := 3; END_IF;\n        3:  IF TC.Q THEN\n                IF METAL THEN STEP := 4; ELSE STEP := 5; END_IF;\n          \
        \  END_IF;\n        4:  IF T1_TURNED THEN STEP := 5; END_IF;\n        5:  IF TL.Q THEN STEP := 6; GOOD := GOOD + 1; END_IF;\n        6:  IF T1_HOME THEN STEP := 0; END_IF;\n    END_CASE;\n    ST2_RAISE := NOT (STEP = 1);\n    T1_TURN := RUN AND (STEP = 4 OR STEP = 5) AND METAL;\n    T1_ROLL_FWD := RUN AND (STEP = 1 OR STEP = 2 OR (STEP = 3 AND NOT TC.Q) OR STEP = 5);\n    D1 := GOOD;\nEND_PROGRAM\n"}
    di: 17
    do: 11
    ai: 1
    ao: 1
    migrated_from: CELL1
  node: [300, 290]
- id: SRC
  type: source
  name: 上游来料
  pos: [3, 6.3]
  size: [3, 3]
  node: [40, 120]
  params:
    interval: uniform(8,9)
- id: OUT
  type: sink
  name: 下游
  pos: [20, 6.3]
  size: [3, 3]
  node: [560, 80]
  params: {}
- id: NG
  type: sink
  name: 不合格品
  pos: [20, 10.3]
  size: [3, 3]
  node: [560, 200]
  params: {scrap: true, scrap_cause: 单元剔除}

links:
- {id: L1, kind: material, from: SRC, from_port: out, to: CELL1, to_port: in}
- {id: L2, kind: material, from: CELL1, from_port: out, to: OUT, to_port: in}
- {id: L3, kind: material, from: CELL1, from_port: ng, to: NG, to_port: in}
- id: SIG1
  kind: signal
  from: CELL1
  to: PLC1
  signals:
  - {point: IN1_READY, ch: I0.0, dir: in}
  - {point: C1_FWD, ch: Q0.0, dir: out}
  - {point: ST1_RAISE, ch: Q0.1, dir: out}
  - {point: S1, ch: I0.1, dir: in}
  - {point: V1_DETECT, ch: I0.2, dir: in}
  - {point: V1_CODE, ch: IW100, dir: in}
  - {point: S2, ch: I0.3, dir: in}
  - {point: P1_FRONT, ch: I0.4, dir: in}
  - {point: P1_BACK, ch: I0.5, dir: in}
  - {point: P1_EXTEND, ch: Q0.2, dir: out}
  - {point: OUT_NG_BUSY, ch: I0.6, dir: in}
  - {point: ST2_RAISE, ch: Q0.3, dir: out}
  - {point: IND1, ch: I0.7, dir: in}
  - {point: S_ST, ch: I1.0, dir: in}
  - {point: T1_HOME, ch: I1.1, dir: in}
  - {point: T1_TURNED, ch: I1.2, dir: in}
  - {point: T1_PART, ch: I1.3, dir: in}
  - {point: T1_TURN, ch: Q0.4, dir: out}
  - {point: T1_ROLL_FWD, ch: Q0.5, dir: out}
  - {point: T1_ROLL_REV, ch: Q0.6, dir: out}
  - {point: C2_FWD, ch: Q0.7, dir: out}
  - {point: C3_FWD, ch: Q1.0, dir: out}
  - {point: OUT_PL_BUSY, ch: I1.4, dir: in}
  - {point: OUT_ME_BUSY, ch: I1.5, dir: in}
  - {point: START, ch: I1.6, dir: in}
  - {point: STOP, ch: I1.7, dir: in}
  - {point: ESTOP, ch: I2.0, dir: in}
  - {point: LAMP_RUN, ch: Q1.1, dir: out}
  - {point: LAMP_WORK, ch: Q1.2, dir: out}
  - {point: D1, ch: QW100, dir: out}
  all_io: true

groups: []

notes: []

scene: s15_full_line
